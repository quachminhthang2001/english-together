 {title:'Hỏi đường',image:'images/day1-reflex-1.jpg',en:['Excuse me. I’m looking for Lee’s Lighting.','Just keep going. It’s down the street on the left side.'],ipa:['/ɪkˈskjuːz miː. aɪm ˈlʊkɪŋ fər liːz ˈlaɪtɪŋ/','/dʒʌst kiːp ˈɡoʊɪŋ. ɪts daʊn ðə striːt ɑːn ðə left saɪd/'],vi:['Xin lỗi, tôi đang tìm cửa hàng Lee’s Lighting.','Cứ tiếp tục đi. Cửa hàng nằm dọc con đường này, bên trái.']},
 {title:'Gặp ông Lee',image:'images/day1-reflex-2.jpg',en:['Come in! I’m Alan Lee.','Nice to meet you Mr. Lee.'],ipa:['/kʌm ɪn! aɪm ˈælən liː/','/naɪs tə miːt juː ˈmɪstər liː/'],vi:['Mời vào! Tôi là Alan Lee.','Rất vui được gặp ông, ông Lee.']},
 {title:'Nhờ mang sách đến nhà',image:'images/day1-reflex-3.jpg',en:['You left your book in my car.','Can you drop it by my house?'],ipa:['/juː left jər bʊk ɪn maɪ kɑːr/','/kən juː drɑːp ɪt baɪ maɪ haʊs/'],vi:['Bạn để quên sách trong xe của tôi.','Bạn có thể mang nó ghé qua nhà tôi được không?']}

const additionalScenes = {"2": [{"title": "Gọi cho quản lý", "image": "images/day2-reflex-1.png", "en": ["Can I speak to the manager?", "Yes, can I put you on hold for a minute?"], "ipa": ["/kən aɪ spiːk tə ðə ˈmænɪdʒər/", "/jes, kən aɪ pʊt juː ɑːn hoʊld fər ə ˈmɪnɪt/"], "vi": ["Tôi có thể nói chuyện với người quản lý không?", "Vâng, tôi có thể để bạn chờ máy một phút không?"]}, {"title": "Phụ trách giao hàng", "image": "images/day2-reflex-2.png", "en": ["Who’s in charge of deliveries?", "Mr. Smith is."], "ipa": ["/huːz ɪn tʃɑːrdʒ əv dɪˈlɪvəriz/", "/ˈmɪstər smɪθ ɪz/"], "vi": ["Ai phụ trách việc giao hàng?", "Ông Smith phụ trách."]}, {"title": "Sắp hết thời gian", "image": "images/day2-reflex-3.png", "en": ["When is the deadline?", "1 pm. We’re running short on time."], "ipa": ["/wen ɪz ðə ˈdedlaɪn/", "/wʌn piː ˈem. wɪr ˈrʌnɪŋ ʃɔːrt ɑːn taɪm/"], "vi": ["Hạn chót là khi nào?", "Một giờ chiều. Chúng ta sắp hết thời gian rồi."]}], "3": [{"title": "Nhanh lên", "image": "images/day3-reflex-1.png", "en": ["It’s already 12:55 PM. We’re late.", "Let’s get a move on!"], "ipa": ["/ɪts ɔːlˈredi twelv ˈfɪfti faɪv piː ˈem. wɪr leɪt/", "/lets ɡet ə muːv ɑːn/"], "vi": ["Đã 12 giờ 55 phút rồi. Chúng ta muộn rồi.", "Nhanh lên nào!"]}, {"title": "Đánh vần tên đường", "image": "images/day3-reflex-2.png", "en": ["Sorry, what street?", "Maple Street. M for Mexico, A for Apple, P for pink, L for land, E for English."], "ipa": ["/ˈsɑːri, wʌt striːt/", "/ˈmeɪpəl striːt. em fər ˈmeksɪkoʊ, eɪ fər ˈæpəl, piː fər pɪŋk, el fər lænd, iː fər ˈɪŋɡlɪʃ/"], "vi": ["Xin lỗi, đường nào cơ?", "Đường Maple. M như Mexico, A như Apple, P như pink, L như land, E như English."]}, {"title": "Tại phòng kinh doanh Honda", "image": "images/day3-reflex-3.png", "en": ["Good afternoon, Honda Marketing. How can I help you?", "Yes, I would like to buy a car."], "ipa": ["/ɡʊd ˌæftərˈnuːn, ˈhɑːndə ˈmɑːrkɪtɪŋ. haʊ kən aɪ help juː/", "/jes, aɪ wʊd laɪk tə baɪ ə kɑːr/"], "vi": ["Chào buổi chiều, bộ phận tiếp thị Honda. Tôi có thể giúp gì?", "Vâng, tôi muốn mua một chiếc ô tô."]}], "4": [{"title": "Có điện thoại cho bạn", "image": "images/day4-reflex-1.png", "en": ["Who’s that on the phone?", "It’s for you. It’s your wife."], "ipa": ["/huːz ðæt ɑːn ðə foʊn/", "/ɪts fər juː. ɪts jər waɪf/"], "vi": ["Ai đang gọi điện vậy?", "Có điện thoại cho bạn. Là vợ bạn đấy."]}, {"title": "Một giờ nữa", "image": "images/day4-reflex-2.png", "en": ["When will you be back?", "I’ll be back in an hour."], "ipa": ["/wen wɪl juː bi bæk/", "/aɪl bi bæk ɪn ən ˈaʊər/"], "vi": ["Khi nào bạn quay lại?", "Tôi sẽ quay lại sau một giờ."]}, {"title": "Tiến độ dự án", "image": "images/day4-reflex-3.png", "en": ["How’s the project coming along?", "Great, I’m ahead of schedule.", "Fine, I’m on schedule.", "Not good, I’m behind schedule."], "ipa": ["/haʊz ðə ˈprɑːdʒekt ˈkʌmɪŋ əˈlɔːŋ/", "/ɡreɪt, aɪm əˈhed əv ˈskedʒuːl/", "/faɪn, aɪm ɑːn ˈskedʒuːl/", "/nɑːt ɡʊd, aɪm bɪˈhaɪnd ˈskedʒuːl/"], "vi": ["Dự án tiến triển thế nào?", "Tuyệt, tôi đang vượt tiến độ.", "Ổn, tôi đang đúng tiến độ.", "Không tốt, tôi đang chậm tiến độ."]}], "5": [{"title": "Bận việc", "image": "images/day5-reflex-1.png", "en": ["Can we meet today?", "Sorry, I’m tied up. How about tomorrow?"], "ipa": ["/kən wiː miːt təˈdeɪ/", "/ˈsɑːri, aɪm taɪd ʌp. haʊ əˈbaʊt təˈmɑːroʊ/"], "vi": ["Hôm nay chúng ta gặp nhau được không?", "Xin lỗi, tôi bận rồi. Ngày mai được không?"]}, {"title": "Gọi lại sau", "image": "images/day5-reflex-2.png", "en": ["Can you call me back later?", "Yes, I’ll call you back later. When is a good time?"], "ipa": ["/kən juː kɔːl miː bæk ˈleɪtər/", "/jes, aɪl kɔːl juː bæk ˈleɪtər. wen ɪz ə ɡʊd taɪm/"], "vi": ["Bạn có thể gọi lại cho tôi sau không?", "Được, tôi sẽ gọi lại sau. Khi nào thuận tiện?"]}, {"title": "Bị kẹt xe", "image": "images/day5-reflex-3.png", "en": ["Why are you so late?", "The heavy traffic held me up."], "ipa": ["/waɪ ər juː soʊ leɪt/", "/ðə ˈhevi ˈtræfɪk held miː ʌp/"], "vi": ["Sao bạn đến muộn vậy?", "Giao thông đông đúc khiến tôi bị trễ."]}, {"title": "Dời thùng hàng", "image": "images/day5-reflex-4.png", "en": ["How can I help?", "Please move these boxes out of the way."], "ipa": ["/haʊ kən aɪ help/", "/pliːz muːv ðiːz ˈbɑːksɪz aʊt əv ðə weɪ/"], "vi": ["Tôi có thể giúp gì?", "Làm ơn chuyển những thùng này ra khỏi lối đi."]}], "6": [{"title": "Lật thùng hàng", "image": "images/day6-reflex-1.png", "en": ["The box is upside down! Please flip it right side up!", "Oops! Sorry, I will flip it right side up."], "ipa": ["/ðə bɑːks ɪz ˌʌpsaɪd ˈdaʊn. pliːz flɪp ɪt raɪt saɪd ʌp/", "/uːps, ˈsɑːri. aɪ wɪl flɪp ɪt raɪt saɪd ʌp/"], "vi": ["Thùng đang bị lộn ngược! Hãy lật nó về đúng chiều!", "Ôi, xin lỗi! Tôi sẽ lật lại cho đúng chiều."]}, {"title": "Thảo nào anh ấy buồn", "image": "images/day6-reflex-2.png", "en": ["You look so sad!", "Yes.", "Why is he so sad?", "His wife just passed away.", "No wonder he’s sad."], "ipa": ["/juː lʊk soʊ sæd/", "/jes/", "/waɪ ɪz hiː soʊ sæd/", "/hɪz waɪf dʒʌst pæst əˈweɪ/", "/noʊ ˈwʌndər hiːz sæd/"], "vi": ["Trông bạn buồn quá!", "Vâng.", "Tại sao anh ấy buồn vậy?", "Vợ anh ấy vừa qua đời.", "Thảo nào anh ấy buồn."]}, {"title": "Để tôi trả tiền", "image": "images/day6-reflex-3.png", "en": ["Let’s split the check.", "No, it’s on me. You paid last time."], "ipa": ["/lets splɪt ðə tʃek/", "/noʊ, ɪts ɑːn miː. juː peɪd læst taɪm/"], "vi": ["Chúng ta chia tiền hóa đơn nhé.", "Không, để tôi trả. Lần trước bạn trả rồi."]}, {"title": "Bị kẹt xe một giờ", "image": "images/day6-reflex-4.png", "en": ["What held you up?", "I’m so sorry, I was stuck in traffic for an hour."], "ipa": ["/wʌt held juː ʌp/", "/aɪm soʊ ˈsɑːri, aɪ wəz stʌk ɪn ˈtræfɪk fər ən ˈaʊər/"], "vi": ["Điều gì khiến bạn bị trễ?", "Tôi rất xin lỗi, tôi bị kẹt xe suốt một giờ."]}]};
const scenesByDay = {1:sceneData,...additionalScenes};

// Reflex scenes Day 7–10: added without modifying original lessons or audio.

y! We need you to come right away."],"ipa":["/həˈloʊ, eɪ tiː ˈplʌmɪŋ? ðɪs ɪz ən ɪˈmɜːrdʒənsi! wiː niːd juː tə kʌm raɪt əˈweɪ/"],"vi":["A lô, AT Plumbing phải không? Đây là việc khẩn cấp! Chúng tôi cần các anh đến ngay."]}],"9":[{"title":"Caused by","image":"images/day9-reflex-1.png","en":["Maybe a broken pipe caused the problem?","That’s right. The problem was caused by a broken pipe."],"ipa":["/ˈmeɪbi ə ˈbroʊkən paɪp kɔːzd ðə ˈprɑːbləm/","/ðæts raɪt. ðə ˈprɑːbləm wəz kɔːzd baɪ ə ˈbroʊkən paɪp/"],"vi":["Có lẽ một đường ống bị vỡ đã gây ra vấn đề?","Đúng vậy. Vấn đề do một đường ống bị vỡ gây ra."]},{"title":"It’s not the end of the world","image":"images/day9-reflex-2.png","en":["Oh, no! My hair! It’s ruined.","It’s not the end of the world. Your hair will grow back."],"ipa":["/oʊ noʊ! maɪ her! ɪts ˈruːɪnd/","/ɪts nɑːt ðə end əv ðə wɜːrld. jər her wɪl ɡroʊ bæk/"],"vi":["Ôi không! Tóc của tôi! Hỏng hết rồi.","Không phải tận thế đâu. Tóc bạn sẽ mọc lại."]},{"title":"In the same boat","image":"images/day9-reflex-3.png","en":["When will my hair grow back?","I know how you feel. We are in the same boat."],"ipa":["/wen wɪl maɪ her ɡroʊ bæk/","/aɪ noʊ haʊ juː fiːl. wiː ɑːr ɪn ðə seɪm boʊt/"],"vi":["Khi nào tóc tôi mọc lại?","Tôi hiểu cảm giác của bạn. Chúng ta cùng cảnh ngộ."]}],"10":[{"title":"I’m not following you","image":"images/day10-reflex-1.png","en":["Turn left, then right and left again. Then go straight until Maple Street, then right and left at…","I’m not following you. Could you start that again?"],"ipa":["/tɜːrn left, ðen raɪt ənd left əˈɡen. ðen ɡoʊ streɪt ənˈtɪl ˈmeɪpəl striːt, ðen raɪt ənd left æt/","/aɪm nɑːt ˈfɑːloʊɪŋ juː. kʊd juː stɑːrt ðæt əˈɡen/"],"vi":["Rẽ trái, rồi phải, rồi lại trái. Đi thẳng đến phố Maple, rồi rẽ phải và trái tại…","Tôi không theo kịp. Bạn có thể nói lại từ đầu không?"]},{"title":"Have change","image":"images/day10-reflex-2.png","en":["Excuse me. Do you have change for a dollar?","Yes, here you are."],"ipa":["/ɪkˈskjuːz miː. də juː function tabs(labels,selected,onSelect){const row=el('div','tabs');labels.forEach((label,i)=>{const b=el('button','tab'+(selected===i?' active':''),label);b.onclick=()=>onSelect(i);row.append(b)});return row}
function home(){app.replaceChildren();for(const section of catalog){const panel=el('section','panel');panel.append(el('h2','',section.name));let tab=0;const content=el('div');const draw=()=>{content.replaceChildren();if(tab===0){const days=el('div','days');for(const day of section.days){const b=el('button','day','Day '+day.number);b.onclick=()=>lesson(section,day);days.append(b)}content.append(days)}else if(section.id==='pronunciation-and-intonation'){renderTest(content)}else{content.append(el('p','muted','Common Words — Test: sẽ bổ sung khi bạn duyệt cách kiểm tra từ vựng. Phần Study vẫn hoạt động bình thường.'))}};const tabSlot=el('div');const choose=i=>{tab=i;tabSlot.replaceChildren(tabs(['Study','Test'],tab,choose));draw()};panel.append(tabSlot,content);choose(0);app.append(panel)}}
function revealPair(parent,scene){const actions=el('div','controls-line');const a=el('button','mini-btn','E + IPA');const b=el('button','mini-btn','V');const en=el('div','dialogue');const vi=el('div','dialogue');en.hidden=true;vi.hidden=true;scene.en.forEach((line,i)=>{en.append(el('p','', (i===0?'A: ':i===1?'B: ':'')+line),el('p','ipa','IPA: '+scene.ipa[i]))});scene.vi.forEach((line,i)=>vi.append(el('p','',(i===0?'A: ':i===1?'B: ':'')+line)));a.onclick=()=>{en.hidden=!en.hidden;a.classList.toggle('active',!en.hidden)};b.onclick=()=>{vi.hidden=!vi.hidden;b.classList.toggle('active',!vi.hidden)};actions.append(a,b);parent.append(actions,en,vi)}
function renderScene(parent,scene){parent.replaceChildren();const pic=el('img','scene-photo');pic.src=scene.image;pic.alt='Ngữ cảnh: '+scene.title;pic.loading='lazy';parent.append(pic);const titleButton=el('button','mini-btn','Hiện tiêu đề');const heading=el('h3','',scene.title);heading.hidden=true;titleButton.onclick=()=>{heading.hidden=!heading.hidden;titleButton.textContent=heading.hidden?'Hiện tiêu đề':'Ẩn tiêu đề';titleButton.classList.toggle('active',!heading.hidden)};parent.append(titleButton,heading);revealPair(parent,scene)}
function renderReflex(parent,dayNumber){const scenes=scenesByDay[dayNumber]||[];let current=0;const nav=el('div','scene-tools');const view=el('div');const status=el('p','muted-note');const next=el('button','mini-btn','Ngữ cảnh tiếp →');const change=i=>{current=i;nav.replaceChildren();scenes.forEach((sc,j)=>{const b=el('button','mini-btn'+(i===j?' active':''),'Cảnh '+(j+1));b.onclick=()=>change(j);nav.append(b)});renderScene(view,scenes[i]);status.textContent='Ngữ cảnh '+(i+1)+'/'+scenes.length};if(!scenes.length){parent.append(el('p','muted','Chưa có hình ngữ cảnh.'));return}next.onclick=()=>change((current+1)%scenes.length);parent.append(nav,view,status,next);change(0)}
function renderTest(parent){const source=learnedDays.flatMap(day=>(scenesByDay[day]||[]).map((sc,i)=>({...sc,day,id:i})));if(!source.length){parent.append(el('p','muted','Chưa có ngữ cảnh đã học.'));return}let order=[],at=0;const top=el('div','test-top'),body=el('div'),actions=el('div','test-actions');const label=el('strong'),shuffle=el('button','mini-btn','↻ Trộn lượt mới'),next=el('button','mini-btn','Tiếp theo →');top.append(label,shuffle);actions.append(next);parent.append(top,body,actions);function mix(){order=source.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}at=0;draw()}function draw(){const scene=source[order[at]];label.textContent='Ngữ cảnh '+(at+1)+'/'+order.length+' · Day '+scene.day;renderScene(body,scene);next.textContent=at===order.length-1?'Hoàn thành — trộn lượt mới':'Ngữ cảnh tiếp →'}shuffle.onclick=mix;next.onclick=()=>{if(at===order.length-1)mix();else{at++;draw()}};mix()}

function isPractice(file,day){const m=file.name.match(/^PRACTICE\s+DAY\s+(\d+)\./i);return !!m&&Number(m[1])===day}
function showAnswer(item,entry,answers,allButton){
 const btn=el('button','reveal','Hiện đáp án');btn.type='button';btn.setAttribute('aria-expanded','false');
 const answer=el('div','answer');answer.hidden=true;
 answer.append(el('p','',entry.en),el('p','ipa',entry.ipa),el('p','meaning',entry.vi));
 btn.onclick=()=>{answer.hidden=!answer.hidden;btn.textContent=answer.hidden?'Hiện đáp án':'Ẩn đáp án';btn.setAttribute('aria-expanded',String(!answer.hidden));allButton.textContent=answers.every(a=>!a.answer.hidden)?'Ẩn tất cả':'Hiện tất cả'};
 item.append(btn,answer);answers.push({btn,answer});
}
function compactTrack(parent,file,entry){const item=el('div','compact-track');const audioLine=el('div','audio-line');audioLine.append(el('strong','','Câu '+entry.number));const audio=el('audio');audio.controls=true;audio.preload='none';audio.src=file.src;audioLine.append(audio);item.append(audioLine);const controls=el('div','controls-line');const sel=el('select');[0.75,1,1.25].forEach(v=>{const opt=el('option','',v+'×');opt.value=v;if(v===1)opt.selected=true;sel.append(opt)});sel.onchange=()=>audio.playbackRate=Number(sel.value);controls.append(sel);const eb=el('button','mini-btn','E + IPA'),vb=el('button','mini-btn','V');const e=el('div','compact-answer'),v=el('div','compact-answer');e.hidden=true;v.hidden=true;e.append(el('p','','E: '+entry.en),el('p','ipa','IPA: '+entry.ipa));v.append(el('p','','V: '+entry.vi));eb.onclick=()=>{e.hidden=!e.hidden;eb.classList.toggle('active',!e.hidden)};vb.onclick=()=>{v.hidden=!v.hidden;vb.classList.toggle('active',!v.hidden)};controls.append(eb,vb);item.append(controls,e,v);parent.append(item)}
function renderShadowing(parent,day){const practice=day.files.find(f=>isPractice(f,day.number));if(day.number<=22){const block=el('div');block.append(el('h3','','Ảnh ngữ cảnh — Day '+day.number));const img=el('img','scene-photo');img.src='images/day'+day.number+'-shadowing.'+(day.number===1?'jpg':'png');img.alt='Ảnh tổng hợp ngữ cảnh Day '+day.number;block.append(img);parent.append(block)}if(practice){const top=el('div','practice');top.append(el('strong','','PRACTICE DAY '+day.number));addAudio(top,practice);parent.append(top)}const entries=lessons[String(day.number)]||[];const byName=new Map(entries.map(e=>[e.filename,e]));for(const file of day.files){if(practice===file)continue;if(day.number===2&&/\.wav$/i.test(file.name)&&day.files.some(f=>f.name===file.name.replace(/\.wav$/i,'.mp3')))continue;const item=byName.get(file.name);if(item){compactTrack(parent,file,item)}else{const wrap=el('div','compact-track');if(!(day.number===10&&/^1\.3\s+slow\.mp3$/i.test(file.name)))wrap.append(el('strong','','MP3 chưa đối chiếu'));addAudio(wrap,file);parent.append(wrap)}}}
function lesson(section,day){app.replaceChildren();const back=el('button','back','← Quay lại danh sách');back.onclick=home;app.append(back);const panel=el('section','panel');panel.append(el('h2','',section.name+' — Day '+day.number));const custom=section.id==='pronunciation-and-intonation'&&day.number<=22;if(custom){const slot=el('div'),content=el('div');panel.append(slot,content);const choose=i=>{slot.replaceChildren(tabs(['Shadowing','Reflex'],i,choose));content.replaceChildren();if(i===0)renderShadowing(content,day);else renderReflex(content,day.number);window.scrollTo(0,0)};choose(0)}else if(section.id==='pronunciation-and-intonation'&&day.number<=22){renderShadowing(panel,day)}else{for(const file of day.files){const item=el('div','track');const name=file.name.replace(/\.(mp3|m4a|wav|ogg)$/i,'').replace(/^\d+(?:\.\d+)?[.\s_-]*/,'').replace(/[_]+$/,'').trim();item.append(el('strong','',name||file.name));addAudio(item,file);panel.append(item)}}app.append(panel);window.scrollTo(0,0);const floating=el('button','floating-back','← Danh sách');floating.onclick=home;app.append(floating)}
fetch('manifest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Không tải được danh sách');return r.json()}).then(data=>{catalog=data;home()}).catch(()=>{app.replaceChildren(el('p','','Không tải được danh sách bài nghe. Kiểm tra manifest.json và GitHub Actions.'))});
