<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f7fb"><title>English Listening • Day 1</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#18243b;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:660px;margin:auto;padding:22px 16px 60px}h1{font-size:27px;margin:7px 0}p{color:#5e6b80}header{margin-bottom:22px}.eyebrow{color:#4766a9;font-size:12px;font-weight:800;letter-spacing:1px}.player,.track{background:white;border:1px solid #e1e7f0;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 4px 14px #24375a08}.player{position:sticky;top:8px;z-index:2}.name{font-weight:700;overflow-wrap:anywhere}audio{width:100%;margin:12px 0}button,select{border:1px solid #d2daeb;border-radius:12px;padding:11px 13px;background:#fff;color:#233755;font-size:14px;cursor:pointer}button.primary{background:#345bd4;color:white;border-color:#345bd4}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.track{display:flex;align-items:center;gap:12px}.track.active{border-color:#5578e5;background:#f1f5ff}.track .info{flex:1;min-width:0}.sub{font-size:12px;color:#69768b;margin-top:5px}.pill{font-size:12px;color:#566b94;background:#eaf0fb;border-radius:99px;padding:6px 10px}footer{font-size:12px;color:#758198;margin-top:25px}input{width:100%;padding:13px;border:1px solid #d2daeb;border-radius:12px;font-size:15px}</style></head><body><main><header><div class="eyebrow">ENGLISH LISTENING · LEVEL 1</div><h1>Day 1 — New Words</h1><p>Chọn câu để nghe. Có thể nghe lại, lùi 3 giây và đổi tốc độ.</p></header><section class="player"><div class="eyebrow">ĐANG CHỌN</div><div id="current" class="name">Chọn một câu bên dưới</div><audio id="audio" controls preload="none" playsinline></audio><div class="controls"><button id="back">↶ Lùi 3s</button><button id="replay">↻ Nghe lại</button><label for="speed">Tốc độ</label><select id="speed"><option value="0.75">0.75×</option><option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select></div></section><h2>Danh sách câu nghe</h2><input id="search" placeholder="Tìm câu tiếng Anh..." aria-label="Tìm câu"><div id="tracks"></div><footer>Âm thanh gốc do bạn cung cấp · Chưa bổ sung nội dung sách và IPA. Web có thể mở trên điện thoại sau khi được đăng lên hosting.</footer></main><script>
const tracks=[{"name": "0.1 she made me hurry_", "src": "0.1 she made me hurry_.mp3", "duration": 1.4}, {"name": "1. I made my decision.", "src": "1. I made my decision..mp3", "duration": 1.8}, {"name": "2. They agreed to work together.", "src": "2. They agreed to work together..mp3", "duration": 2.3}, {"name": "3. Tom concentrated on his work.", "src": "3. Tom concentrated on his work..mp3", "duration": 2.4}, {"name": "4. He came in through the window.", "src": "4. He came in through the window..mp3", "duration": 1.8}, {"name": "5. I cannot afford to buy such an expensive car", "src": "5. I cannot afford to buy such an expensive car.mp3", "duration": 3.7}, {"name": "6.You make me happy.", "src": "6.You make me happy..mp3", "duration": 1.7}, {"name": "7. Could I make a reservation", "src": "7. Could I make a reservation.mp3", "duration": 1.8}];
const audio=document.getElementById('audio'),list=document.getElementById('tracks'),current=document.getElementById('current');let active=-1;
function select(i){active=i;const t=tracks[i];current.textContent=t.name;audio.src=t.src;audio.playbackRate=Number(document.getElementById('speed').value);audio.play().catch(()=>{});render()}
function render(){const q=document.getElementById('search').value.toLowerCase();list.replaceChildren();tracks.forEach((t,i)=>{if(!t.name.toLowerCase().includes(q))return;const el=document.createElement('div');el.className='track'+(i===active?' active':'');const b=document.createElement('button');b.className=i===active?'primary':'';b.textContent=i===active?'▶ Đang chọn':'▶ Nghe';b.onclick=()=>select(i);const info=document.createElement('div');info.className='info';const name=document.createElement('div');name.className='name';name.textContent=t.name.replace(/^\d+(?:\.\d+)?\s*/,'');const sub=document.createElement('div');sub.className='sub';sub.textContent=t.duration+' giây · MP3 gốc';info.append(name,sub);el.append(b,info);list.append(el)})}
document.getElementById('back').onclick=()=>{audio.currentTime=Math.max(0,audio.currentTime-3)};document.getElementById('replay').onclick=()=>{audio.currentTime=0;audio.play().catch(()=>{})};document.getElementById('speed').onchange=e=>audio.playbackRate=Number(e.target.value);document.getElementById('search').oninput=render;render();
</script></body></html>
