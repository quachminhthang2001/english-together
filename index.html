<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Together</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17253b;background:#f5f7fc}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:22px 16px 80px}header{padding:18px 0 22px}h1{margin:0;font-size:30px}p{color:#61708a}.panel{background:white;border:1px solid #e4e9f2;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 3px 15px #1831540a}h2{font-size:20px;margin:0 0 14px}.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}.day{border:1px solid #dce3f0;border-radius:12px;background:#f8faff;padding:14px 6px;font-weight:700;color:#25426c;cursor:pointer}.day:hover,.day:focus{background:#e8f0ff}.muted{color:#71809a;font-size:14px}.back{background:none;border:0;color:#2457b5;font-weight:700;padding:10px 0;cursor:pointer}.track{border-top:1px solid #e9edf4;padding:16px 0}.track strong{display:block;margin-bottom:9px;overflow-wrap:anywhere}.track audio{width:100%;height:42px}.speed{margin-top:7px;display:flex;align-items:center;gap:8px;color:#60708b;font-size:13px}select{padding:5px;border-radius:7px;border:1px solid #d5ddeb}#notice{color:#63738b}footer{color:#8792a6;text-align:center;font-size:12px;margin-top:24px}.answer{margin:12px 0;line-height:1.65}.answer p{margin:5px 0;color:#17253b}.answer .ipa{color:#526781}.answer .meaning{color:#425b79}.reveal,.all-reveal{border:1px solid #cfdbef;background:#f7faff;color:#234c8d;border-radius:9px;padding:9px 12px;font-weight:650;cursor:pointer}.all-reveal{margin:4px 0 12px}.practice{border:1px solid #d5e4fb;background:#f6f9ff;border-radius:12px;padding:14px;margin:14px 0}.practice strong{display:block;margin-bottom:10px}.practice audio{width:100%}.warning{font-size:13px;color:#98571b}
</style>
</head>
<body><main><header><h1>🎧 English Together</h1><p>Listen • Practice • Improve</p></header><div id="app"><p id="notice">Đang tải danh sách bài nghe...</p></div><footer>Học mỗi ngày, tiến bộ từng chút một.</footer></main>
<script>
let catalog=[];const app=document.getElementById('app');
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function home(){app.replaceChildren();for(const section of catalog){const panel=el('section','panel');panel.append(el('h2','',section.name));const days=el('div','days');if(!section.days.length)panel.append(el('p','muted','Chưa có bài nghe.'));else{for(const day of section.days){const b=el('button','day','Day '+day.number);b.onclick=()=>lesson(section,day);days.append(b)}panel.append(days)}app.append(panel)}}
function addAudio(item,file){const audio=el('audio');audio.controls=true;audio.preload='none';audio.src=file.src;item.append(audio);const speed=el('label','speed','Tốc độ: ');const sel=el('select');for(const value of [0.75,1,1.25]){const opt=el('option','',value+'×');opt.value=value;if(value===1)opt.selected=true;sel.append(opt)}sel.onchange=()=>audio.playbackRate=Number(sel.value);speed.append(sel);item.append(speed)}
const day1=[
{en:'Keep going',ipa:'/kiːp ˈɡoʊɪŋ/',vi:'Tiếp tục đi; cứ đi tiếp.'},
{en:'Excuse me. I’m looking for Lee’s Lighting.',ipa:'/ɪkˈskjuːz miː. aɪm ˈlʊkɪŋ fər liːz ˈlaɪtɪŋ/',vi:'Xin lỗi. Tôi đang tìm cửa hàng Lee’s Lighting.'},
{en:'Just keep going. It’s down the street on the left side.',ipa:'/dʒʌst kiːp ˈɡoʊɪŋ. ɪts daʊn ðə striːt ɑːn ðə lɛft saɪd/',vi:'Cứ tiếp tục đi. Nó nằm ở phía dưới con đường, bên tay trái.'},
{en:'Mr. Lee',ipa:'/ˈmɪstɚ liː/',vi:'Ông Lee.'},
{en:'Come in! I’m Alan Lee.',ipa:'/kʌm ɪn! aɪm ˈælən liː/',vi:'Mời vào! Tôi là Alan Lee.'},
{en:'Nice to meet you, Mr. Lee.',ipa:'/naɪs tə miːt juː, ˈmɪstɚ liː/',vi:'Rất vui được gặp ông, ông Lee.'},
{en:'Drop by',ipa:'/drɑːp baɪ/',vi:'Ghé qua; tạt qua.'},
{en:'You left your book in my car.',ipa:'/juː lɛft jɚ bʊk ɪn maɪ kɑːr/',vi:'Bạn đã để quên sách trong xe của tôi.'},
{en:'Can you drop it by my house?',ipa:'/kən juː drɑːp ɪt baɪ maɪ haʊs/',vi:'Bạn có thể ghé nhà tôi và mang nó đến không?'}
];
function normalized(s){return s.toLowerCase().normalize('NFKC').replace(/\.(mp3|m4a|wav|ogg)$/i,'').replace(/^\s*\d+\s*[.\-_ ]+\s*/,'').replace(/[’‘]/g,"'").replace(/[^a-z0-9']+/g,' ').trim()}
function numberFromFilename(name){const m=name.match(/^\s*(\d+)\s*[.\-_ ]+/);return m?Number(m[1]):null}
function isPractice(file){return /practice\s*day\s*0?1\b/i.test(file.name.replace(/[._-]+/g,' '))}
function dayOne(section,day,panel){const practice=day.files.find(isPractice);if(practice){const top=el('div','practice');top.append(el('strong','','PRACTICE DAY 1'));addAudio(top,practice);panel.append(top)}else{panel.append(el('p','warning','Chưa tìm thấy MP3 PRACTICE DAY 1 trong danh sách.'))}
const candidates=day.files.filter(f=>!isPractice(f));const entries=day1.map((data,i)=>{let file=candidates.find(f=>numberFromFilename(f.name)===i+1);if(!file)file=candidates.find(f=>normalized(f.name)===normalized(data.en));return{data,file,index:i+1}});const used=new Set(entries.filter(e=>e.file).map(e=>e.file));
const allButton=el('button','all-reveal','Hiện tất cả');panel.append(allButton);const answers=[];
for(const entry of entries){const item=el('div','track');item.append(el('strong','','Câu '+String(entry.index).padStart(2,'0')));if(entry.file){addAudio(item,entry.file)}else{item.append(el('p','warning','Chưa ghép được MP3 cho câu này; cần kiểm tra tên file.'))}
const btn=el('button','reveal','Hiện đáp án');btn.type='button';btn.setAttribute('aria-expanded','false');const answer=el('div','answer');answer.hidden=true;answer.append(el('p','',entry.data.en),el('p','ipa',entry.data.ipa),el('p','meaning',entry.data.vi));btn.onclick=()=>{answer.hidden=!answer.hidden;btn.textContent=answer.hidden?'Hiện đáp án':'Ẩn đáp án';btn.setAttribute('aria-expanded',String(!answer.hidden));allButton.textContent=answers.every(a=>!a.hidden)?'Ẩn tất cả':'Hiện tất cả'};item.append(btn,answer);answers.push(answer);panel.append(item)}
allButton.onclick=()=>{const reveal=answers.some(a=>a.hidden);answers.forEach(a=>{a.hidden=!reveal;const b=a.previousSibling;b.textContent=reveal?'Ẩn đáp án':'Hiện đáp án';b.setAttribute('aria-expanded',String(reveal))});allButton.textContent=reveal?'Ẩn tất cả':'Hiện tất cả'};
for(const file of candidates.filter(f=>!used.has(f))){const item=el('div','track');item.append(el('strong','','MP3 chưa đối chiếu'));addAudio(item,file);panel.append(item)}
}
function lesson(section,day){app.replaceChildren();const back=el('button','back','← Quay lại danh sách');back.onclick=home;app.append(back);const panel=el('section','panel');panel.append(el('h2','',section.name+' — Day '+day.number));panel.append(el('p','muted',day.files.length+' bài nghe'));if(section.id==='pronunciation-and-intonation'&&day.number===1){dayOne(section,day,panel)}else{for(const file of day.files){const item=el('div','track');const name=file.name.replace(/\.(mp3|m4a|wav|ogg)$/i,'').replace(/^\d+(?:\.\d+)?[.\s_-]*/,'').replace(/[_]+$/,'').trim();item.append(el('strong','',name||file.name));addAudio(item,file);panel.append(item)}}app.append(panel);window.scrollTo(0,0)}
fetch('manifest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Không tải được danh sách');return r.json()}).then(data=>{catalog=data;home()}).catch(()=>{app.replaceChildren(el('p','','Không tải được danh sách bài nghe. Kiểm tra manifest.json và GitHub Actions.'))});
</script></body></html>
