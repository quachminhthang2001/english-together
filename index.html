<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Together</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17253b;background:#f5f7fc}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:22px 16px 80px}header{padding:18px 0 22px}h1{margin:0;font-size:30px}p{color:#61708a}.panel{background:white;border:1px solid #e4e9f2;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 3px 15px #1831540a}h2{font-size:20px;margin:0 0 14px}.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}.day{border:1px solid #dce3f0;border-radius:12px;background:#f8faff;padding:14px 6px;font-weight:700;color:#25426c;cursor:pointer}.day:hover,.day:focus{background:#e8f0ff}.muted{color:#71809a;font-size:14px}.back{background:none;border:0;color:#2457b5;font-weight:700;padding:10px 0;cursor:pointer}.track{border-top:1px solid #e9edf4;padding:16px 0}.track strong{display:block;margin-bottom:9px;overflow-wrap:anywhere}.track audio{width:100%;height:42px}.speed{margin-top:7px;display:flex;align-items:center;gap:8px;color:#60708b;font-size:13px}select{padding:5px;border-radius:7px;border:1px solid #d5ddeb}#notice{color:#63738b}footer{color:#8792a6;text-align:center;font-size:12px;margin-top:24px}
</style></head><body><main><header><h1>🎧 English Together</h1><p>Listen • Practice • Improve</p></header><div id="app"><p id="notice">Đang tải danh sách bài nghe...</p></div><footer>Học mỗi ngày, tiến bộ từng chút một.</footer></main><script>
let catalog=[];const app=document.getElementById('app');
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function home(){app.replaceChildren();for(const section of catalog){const panel=el('section','panel');panel.append(el('h2','',section.name));const days=el('div','days');if(!section.days.length)panel.append(el('p','muted','Chưa có bài nghe.'));else {for(const day of section.days){const b=el('button','day','Day '+day.number);b.onclick=()=>lesson(section,day);days.append(b)}panel.append(days)}app.append(panel)}}
function lesson(section,day){app.replaceChildren();const back=el('button','back','← Quay lại danh sách');back.onclick=home;app.append(back);const panel=el('section','panel');panel.append(el('h2','',section.name+' — Day '+day.number));panel.append(el('p','muted',day.files.length+' bài nghe'));for(const file of day.files){const item=el('div','track');const name=file.name.replace(/\.(mp3|m4a|wav|ogg)$/i,'').replace(/^\d+(?:\.\d+)?[.\s_-]*/,'').replace(/[_]+$/,'').trim();item.append(el('strong','',name||file.name));const audio=el('audio');audio.controls=true;audio.preload='none';audio.src=file.src;item.append(audio);const speed=el('label','speed','Tốc độ: ');const sel=el('select');for(const value of [0.75,1,1.25]){const opt=el('option','',value+'×');opt.value=value;if(value===1)opt.selected=true;sel.append(opt)}sel.onchange=()=>audio.playbackRate=Number(sel.value);speed.append(sel);item.append(speed);panel.append(item)}app.append(panel);window.scrollTo(0,0)}
fetch('manifest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Không tải được danh sách');return r.json()}).then(data=>{catalog=data;home()}).catch(()=>{app.replaceChildren(el('p','', 'Không tải được danh sách bài nghe. Kiểm tra cấu hình Netlify build.'))});
</script></body></html>
